name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund --fetch-retries=5 --fetch-timeout=300000 && break
            echo "第 $i 次安装失败，重试…"
            sleep 5
          done
          test -d node_modules/@capacitor/core

      - name: 生成 android 工程（若未生成）
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: 同步前端资源
        run: npx cap sync android

      - name: 允许 HTTP 明文访问（很多教务系统仍是 http）
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $F || \
            sed -i '0,/<application /s//<application android:usesCleartextTraffic="true" /' $F
          grep -n usesCleartextTraffic $F || true

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursetable-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
